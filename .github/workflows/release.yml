name: SYNCHRO CI & Android Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and publish (leave empty for a CI-only run)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Asset name must stay byte-identical across releases: this is what makes
  # /releases/latest/download/SYNCHRO-Android.apk a permanent link.
  APK_ASSET_NAME: SYNCHRO-Android.apk
  PRODUCTION_API_URL: https://jarvis-synchro-backend.up.railway.app

jobs:
  backend-test:
    name: Backend test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest
        run: pytest backend

  flutter-check:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

  android-release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    needs: [ backend-test, flutter-check ]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          PUBSPEC_VERSION="$(grep -E '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d+ -f1)"
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag $TAG does not match pubspec version $PUBSPEC_VERSION. Bump pubspec.yaml before tagging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Release signing is not configured. Missing GitHub Actions secrets:$missing"
            echo "Add the SYNCHRO release keystore (base64) and its passwords under Settings > Secrets and variables > Actions. Never generate a throwaway keystore here: a new key breaks the ability to update installed apps."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/synchro-release.keystore
          if [ ! -s android/app/synchro-release.keystore ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=synchro-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install packages
        run: flutter pub get

      - name: Build signed release APK
        env:
          SYNCHRO_API_URL: ${{ secrets.SYNCHRO_API_URL }}
        run: |
          API_URL="${SYNCHRO_API_URL:-$PRODUCTION_API_URL}"
          echo "Building against backend: $API_URL"
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::Refusing to ship a non-HTTPS backend URL: $API_URL"; exit 1;;
          esac
          flutter build apk --release --dart-define=SYNCHRO_API="$API_URL"

      - name: Confirm production signing identity
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK is debug-signed. Release secrets were not applied; refusing to publish."
            exit 1
          fi
          if ! grep -q "CN=SYNCHRO" /tmp/certs.txt; then
            echo "::error::APK is not signed by the SYNCHRO release certificate."
            exit 1
          fi

      - name: Package artifact
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk "release-output/$APK_ASSET_NAME"
          ( cd release-output && sha256sum "$APK_ASSET_NAME" > "$APK_ASSET_NAME.sha256" )
          ls -la release-output

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ASSET_NAME }}
          path: release-output/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: SYNCHRO Android v${{ steps.release.outputs.version }}
          body_path: .github/release-notes.md
          files: |
            release-output/${{ env.APK_ASSET_NAME }}
            release-output/${{ env.APK_ASSET_NAME }}.sha256
          draft: false
          prerelease: false
